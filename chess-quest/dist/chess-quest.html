<style>
:root{
  /* Every colour below is overwritten at boot by applyTheme() in theme.js.
     These defaults only matter for the split second before it runs. */
  --bg:#1b1233; --bg-glow:#2e1a52; --panel:#2a1b4d; --panel-2:#22143f;
  --ink:#f6f2ff; --muted:#b8a9d9;
  --light:#e6f0df; --dark:#009a44;
  --coord-on-light:#2f5e3e; --coord-on-dark:#e6f0df;
  --sel:#ffffff; --last:rgba(255,255,255,.42); --dot:rgba(51,0,114,.50);
  --danger:#ff6b6b; --good:#38d97a; --warn:#ffc845; --accent:#00c25a;
  --btn:#3c2a68; --btn-ghost:#31215a;
  --pc-w:#ffffff; --pc-w-line:#2a1550; --pc-b:#330072; --pc-b-line:#ffffff;
  --radius:16px;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{
  box-sizing:border-box; -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
}
html,body{
  margin:0; padding:0; height:100%; width:100%;
  position:fixed; inset:0; overflow:hidden;          /* kills iOS rubber-band scrolling */
  overscroll-behavior:none;
}
body{
  background:radial-gradient(1200px 600px at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%), var(--bg);
  color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Nunito,system-ui,sans-serif;
  touch-action:manipulation;                          /* no double-tap zoom */
}
#app{
  position:absolute; inset:0;
  padding:calc(8px + var(--safeT)) 10px calc(10px + var(--safeB));
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:grid; gap:8px; align-content:start;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"top" "lad" "brd" "coach" "ctrl";
  max-width:560px; margin:0 auto;
}
/* iPad and landscape phones: board on the left, everything else beside it.
   The board is also capped by viewport height, or a wide-but-short phone in
   landscape produces a board taller than the screen. */
@media (min-aspect-ratio:1/1) and (min-width:640px){
  #app{
    max-width:1040px;
    grid-template-columns:minmax(0,1fr) clamp(238px,32%,340px);
    grid-template-areas:"brd top" "brd lad" "brd coach" "brd ctrl" "brd .";
    align-content:center; gap:8px 16px; padding-left:16px; padding-right:16px;
  }
  #boardArea{
    align-self:center; margin-left:auto; margin-right:auto;
    width:min(100%, calc(100vh - 88px));
    width:min(100%, calc(100dvh - 88px));
  }
}
@media (min-aspect-ratio:1/1) and (max-width:639px){
  #boardArea{
    margin-left:auto; margin-right:auto;
    width:min(100%, calc(100vh - 88px));
    width:min(100%, calc(100dvh - 88px));
  }
}
@media (max-width:759px) and (max-aspect-ratio:9/10) and (min-height:900px){
  #app{align-content:center;}
}

#topbar{grid-area:top; display:flex; align-items:center; gap:8px;}
.botchip{
  flex:1; display:flex; align-items:center; gap:9px;
  background:var(--panel); border-radius:var(--radius); padding:8px 11px; min-width:0;
}
.botchip .face{font-size:26px;line-height:1;}
.botchip .who{min-width:0;}
.botchip .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.botchip .lvl{font-size:11.5px;color:var(--muted);}
.iconbtn{
  background:var(--panel); border:0; color:var(--ink); font-size:18px;
  width:44px;height:44px;border-radius:13px;cursor:pointer;display:grid;place-items:center;
  font-family:inherit;
}
.iconbtn:active{transform:scale(.94);}
.iconbtn.off{opacity:.42;}

#ladder{grid-area:lad; display:flex; gap:4px; align-items:center;}
#ladder .rung{flex:1;height:7px;border-radius:99px;background:var(--btn);transition:background .3s;}
#ladder .rung.done{background:var(--good);}
#ladder .rung.now{background:var(--sel);box-shadow:0 0 10px var(--sel);}
#app.mode-puzzle #ladder{display:none;}

#boardArea{grid-area:brd; display:flex; flex-direction:column; gap:5px; min-width:0;}
.tray{display:flex;align-items:center;gap:2px;min-height:22px;padding:0 3px;flex-wrap:wrap;}
.tray svg.pc{width:19px;height:19px;}
.tray .pts{margin-left:5px;font-size:12px;font-weight:800;color:var(--muted);}

#app.mode-puzzle .tray{display:none;}

#board{
  width:100%; aspect-ratio:1/1; display:grid;
  grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
  border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.45);
  touch-action:none;
}
.sq{position:relative;display:grid;place-items:center;}
.sq.l{background:var(--light);} .sq.d{background:var(--dark);}
.sq .coord{position:absolute;font-size:9px;font-weight:800;opacity:.6;color:var(--coord-on-light);pointer-events:none;}
.sq .coord.f{right:2px;bottom:1px;} .sq .coord.r{left:2px;top:1px;}
.sq.d .coord{color:var(--coord-on-dark);}

/* Pieces are drawn as SVG, not as Unicode glyphs. U+265F (BLACK CHESS PAWN)
   carries Emoji_Presentation=Yes, so iOS renders it as a colour emoji that
   ignores CSS colour and turns White's pawns black. Vectors cannot be
   reinterpreted by a device font. */
.pcwrap{width:80%;height:80%;display:grid;place-items:center;pointer-events:none;}
svg.pc{width:100%;height:100%;display:block;overflow:visible;pointer-events:none;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.32));}
svg.pc.w circle,svg.pc.w path,svg.pc.w rect{fill:var(--pc-w);stroke:var(--pc-w-line);stroke-width:1.5;stroke-linejoin:round;}
svg.pc.b circle,svg.pc.b path,svg.pc.b rect{fill:var(--pc-b);stroke:var(--pc-b-line);stroke-width:1.2;stroke-linejoin:round;}
svg.pc.w .eye{fill:var(--pc-w-line);stroke:none;}
svg.pc.b .eye{fill:var(--pc-b-line);stroke:none;}
svg.pc .slit{fill:none;stroke-width:1.7;stroke-linecap:round;}
svg.pc.w .slit{stroke:var(--pc-w-line);}
svg.pc.b .slit{stroke:var(--pc-b-line);}

.sq.last{box-shadow:inset 0 0 0 100px var(--last);}
.sq.sel{box-shadow:inset 0 0 0 4px var(--sel);}
.sq.right{box-shadow:inset 0 0 0 100px rgba(95,208,140,.45);}
.sq.wrong{box-shadow:inset 0 0 0 100px rgba(255,107,107,.45);}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:var(--dot);pointer-events:none;}
.sq .ring{position:absolute;inset:6%;border-radius:50%;border:5px solid var(--dot);pointer-events:none;}
.sq.check::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,60,60,.85) 0%,rgba(255,60,60,0) 72%);pointer-events:none;}
.sq.danger::before{content:"";position:absolute;inset:4%;border-radius:10px;border:3px dashed var(--danger);pointer-events:none;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
#ghost{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-50%);display:none;}
#ghost svg.pc{width:100%;height:100%;}
svg.crest{width:1em;height:1em;display:block;fill:currentColor;}
.botchip .face svg.crest{width:26px;height:26px;color:var(--accent);}
.big svg.crest{width:56px;height:56px;margin:0 auto;color:var(--accent);}

#coach{
  grid-area:coach; background:var(--panel); border-radius:var(--radius); padding:10px 12px;
  display:flex;gap:10px;align-items:flex-start;min-height:62px;
}
#coach .face{font-size:24px;line-height:1.1;}
#coach .body{flex:1;min-width:0;}
#coach .head{font-weight:800;font-size:14.5px;line-height:1.3;}
#coach .sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
#coach.good .head{color:var(--good);}
#coach.bad .head{color:var(--warn);}
#coach.alert{background:color-mix(in srgb, var(--danger) 22%, var(--panel));}
#coach .acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}

.btn{
  border:0;border-radius:12px;padding:11px 13px;font-weight:800;font-size:13.5px;
  background:var(--btn);color:var(--ink);cursor:pointer;font-family:inherit;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(180deg,#5ac07d,#3fa262);color:#08210f;}
.btn.warn{background:linear-gradient(180deg,#ffcf6a,#e9a637);color:#331f00;}
.btn.ghost{background:var(--btn-ghost);color:var(--muted);}
.btn[disabled]{opacity:.4;pointer-events:none;}

#controls{grid-area:ctrl;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
#controls .btn{padding:11px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;justify-content:center;}
#controls .btn .ic{font-size:17px;}
#controls .btn .hearts{font-size:10px;color:var(--warn);}
#app.mode-puzzle .playonly{display:none;}
#app.mode-play  .puzzonly{display:none;}
#app.mode-puzzle #controls{grid-template-columns:repeat(3,1fr);}

#overlay{
  position:fixed;inset:0;background:rgba(8,11,18,.86);
  display:none;align-items:center;justify-content:center;z-index:50;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + var(--safeT)) 16px calc(16px + var(--safeB));
}
#overlay.on{display:flex;}
.card{background:var(--panel);border-radius:22px;padding:20px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.6);margin:auto;}
.card h1{margin:0 0 4px;font-size:23px;line-height:1.15;}
.card h2{margin:0 0 8px;font-size:19px;}
.card p{margin:6px 0;font-size:14px;color:var(--muted);line-height:1.5;}
.card .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.card .row .btn{flex:1;min-width:120px;padding:14px;font-size:14.5px;}
.big{font-size:52px;text-align:center;line-height:1;margin:6px 0 10px;}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px;}
.promo button{padding:10px 0;border:0;border-radius:14px;background:var(--light);cursor:pointer;display:grid;place-items:center;}
.promo button svg.pc{width:44px;height:44px;}
.promo button:active{transform:scale(.94);}

.moment{background:var(--panel-2);border-radius:14px;padding:11px;margin-top:10px;}
.moment .t{font-weight:800;font-size:14px;}
.moment .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
.moment .btn{margin-top:8px;padding:9px 11px;font-size:12.5px;}
#mini{width:100%;max-width:300px;margin:10px auto 0;position:relative;}
#miniBoard{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:10px;overflow:hidden;}
#miniSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:7px;}
.legend i{display:inline-block;width:11px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px;}

.stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--btn-ghost);}
.stat:last-child{border:0;}
.stat b{color:var(--ink);}
.tip{background:var(--panel-2);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.5;}
.small{font-size:11.5px;color:var(--muted);}
.toggles{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.tg{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:13.5px;gap:10px;}
.tg button.sw{border:0;border-radius:99px;width:54px;height:30px;background:var(--btn);position:relative;cursor:pointer;flex:0 0 auto;}
.tg button.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s;}
.tg button.sw.on{background:var(--good);} .tg button.sw.on::after{left:27px;}
.pill{display:inline-block;background:var(--btn);border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:800;margin-right:6px;}
.pill.good{background:#2c5a41;color:#bff5d6;}
.pill.warn{background:#5a4526;color:#ffe3ae;}
select{width:100%;padding:12px;border-radius:12px;border:0;font-size:14px;font-family:inherit;background:var(--panel-2);color:var(--ink);}
</style>
</head>
<body>
<div id="app" class="mode-play">
  <div id="topbar">
    <div class="botchip">
      <div class="face" id="botFace">🐣</div>
      <div class="who">
        <div class="name" id="botName">Pip the Pawn</div>
        <div class="lvl" id="botLvl">Level 1 of 10</div>
      </div>
    </div>
    <button class="iconbtn" id="btnMode" title="Switch between playing and puzzles">🧩</button>
    <button class="iconbtn" id="btnMenu" title="Menu">☰</button>
  </div>

  <div id="ladder"></div>

  <div id="boardArea">
    <div class="tray theirs" id="trayTheirs"></div>
    <div id="board"></div>
    <div class="tray mine" id="trayMine"></div>

  <div id="coach">
    <div class="face" id="coachFace">🦉</div>
    <div class="body">
      <div class="head" id="coachHead">Tap Play to start your quest!</div>
      <div class="sub" id="coachSub"></div>

  <div id="controls">

    <button class="btn playonly" id="btnGoggles"><span class="ic">🥽</span><span>Danger</span></button>
    <button class="btn playonly" id="btnNew"><span class="ic">🔄</span><span>New game</span></button>
    <button class="btn puzzonly" id="btnPzHint"><span class="ic">💡</span><span>Hint</span></button>
    <button class="btn puzzonly" id="btnPzSkip"><span class="ic">⏭️</span><span>Skip</span></button>

  </div>
</div>

<div id="ghost"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script id="chess-core">
/* ============================================================
   CHESS ENGINE — rules layer
   0x88 board. Pure logic, no DOM. Shared by the game and tests.
   ============================================================ */

var WHITE = 0, BLACK = 1;
var PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
var CB = 8; // color bit: set = black

function pc(type, color) { return type | (color ? CB : 0); }
function typeOf(p) { return p & 7; }
function colorOf(p) { return (p & CB) ? BLACK : WHITE; }

var KNIGHT_D = [-33, -31, -18, -14, 14, 18, 31, 33];
var BISHOP_D = [-17, -15, 15, 17];
var ROOK_D   = [-16, -1, 1, 16];
var KING_D   = [-17, -16, -15, -1, 1, 15, 16, 17];

// move flags
var F_NORMAL = 0, F_DPP = 1, F_KCASTLE = 2, F_QCASTLE = 3, F_EP = 4;

function MOVE(from, to, promo, flag) {
  return from | (to << 7) | ((promo || 0) << 14) | ((flag || 0) << 17);
}
function FROM(m) { return m & 127; }
function TO(m) { return (m >> 7) & 127; }
function PROMO(m) { return (m >> 14) & 7; }
function FLAG(m) { return (m >> 17) & 7; }

// castling rights bits
var C_WK = 1, C_WQ = 2, C_BK = 4, C_BQ = 8;

var SQ = {
  a8: 0, b8: 1, c8: 2, d8: 3, e8: 4, f8: 5, g8: 6, h8: 7,
  a1: 112, b1: 113, c1: 114, d1: 115, e1: 116, f1: 117, g1: 118, h1: 119
};

function fileOf(sq) { return sq & 15; }
function rankOf(sq) { return sq >> 4; }          // 0 = 8th rank, 7 = 1st rank
function sqName(sq) { return 'abcdefgh'[fileOf(sq)] + (8 - rankOf(sq)); }
function nameToSq(n) {
  var f = 'abcdefgh'.indexOf(n[0]);
  var r = 8 - parseInt(n[1], 10);
  return r * 16 + f;
}

/* ---------- state ---------- */

function newState() {
  return {
    b: new Int8Array(128),
    turn: WHITE,
    castle: 0,
    ep: -1,
    half: 0,
    full: 1,
    king: [SQ.e1, SQ.e8],
    hist: []
  };
}

function cloneState(s) {
  var n = newState();
  n.b = Int8Array.from(s.b);
  n.turn = s.turn; n.castle = s.castle; n.ep = s.ep;
  n.half = s.half; n.full = s.full;
  n.king = [s.king[0], s.king[1]];
  n.hist = [];
  return n;
}

var PIECE_CHARS = { p: PAWN, n: KNIGHT, b: BISHOP, r: ROOK, q: QUEEN, k: KING };
var CHAR_OF = { 1: 'p', 2: 'n', 3: 'b', 4: 'r', 5: 'q', 6: 'k' };

function loadFen(fen) {
  var s = newState();
  var parts = fen.trim().split(/\s+/);
  var rows = parts[0].split('/');
  for (var r = 0; r < 8; r++) {
    var f = 0;
    for (var i = 0; i < rows[r].length; i++) {
      var ch = rows[r][i];
      if (ch >= '1' && ch <= '8') { f += parseInt(ch, 10); continue; }
      var color = (ch === ch.toLowerCase()) ? BLACK : WHITE;
      var t = PIECE_CHARS[ch.toLowerCase()];
      var sq = r * 16 + f;
      s.b[sq] = pc(t, color);
      if (t === KING) s.king[color] = sq;
      f++;
    }
  }
  s.turn = (parts[1] === 'b') ? BLACK : WHITE;
  s.castle = 0;
  if (parts[2] && parts[2] !== '-') {
    if (parts[2].indexOf('K') >= 0) s.castle |= C_WK;
    if (parts[2].indexOf('Q') >= 0) s.castle |= C_WQ;
    if (parts[2].indexOf('k') >= 0) s.castle |= C_BK;
    if (parts[2].indexOf('q') >= 0) s.castle |= C_BQ;
  }
  s.ep = (parts[3] && parts[3] !== '-') ? nameToSq(parts[3]) : -1;
  s.half = parts[4] ? parseInt(parts[4], 10) : 0;
  s.full = parts[5] ? parseInt(parts[5], 10) : 1;
  return s;
}

function toFen(s) {
  var out = '';
  for (var r = 0; r < 8; r++) {
    var empty = 0;
    for (var f = 0; f < 8; f++) {
      var p = s.b[r * 16 + f];
      if (!p) { empty++; continue; }
      if (empty) { out += empty; empty = 0; }
      var ch = CHAR_OF[typeOf(p)];
      out += (colorOf(p) === WHITE) ? ch.toUpperCase() : ch;
    }
    if (empty) out += empty;
    if (r < 7) out += '/';
  }
  out += ' ' + (s.turn === WHITE ? 'w' : 'b') + ' ';
  var c = '';
  if (s.castle & C_WK) c += 'K';
  if (s.castle & C_WQ) c += 'Q';
  if (s.castle & C_BK) c += 'k';
  if (s.castle & C_BQ) c += 'q';
  out += (c || '-') + ' ';
  out += (s.ep >= 0 ? sqName(s.ep) : '-') + ' ';
  out += s.half + ' ' + s.full;
  return out;
}

var START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

/* ---------- attacks ---------- */

function isAttacked(s, sq, by) {
  var b = s.b, t, d, i, p;
  // pawns
  if (by === WHITE) {
    t = sq + 15; if (!(t & 0x88) && b[t] === PAWN) return true;
    t = sq + 17; if (!(t & 0x88) && b[t] === PAWN) return true;
  } else {
    t = sq - 15; if (!(t & 0x88) && b[t] === (PAWN | CB)) return true;
    t = sq - 17; if (!(t & 0x88) && b[t] === (PAWN | CB)) return true;
  }
  var kn = pc(KNIGHT, by), kg = pc(KING, by);
  for (i = 0; i < 8; i++) { t = sq + KNIGHT_D[i]; if (!(t & 0x88) && b[t] === kn) return true; }
  for (i = 0; i < 8; i++) { t = sq + KING_D[i]; if (!(t & 0x88) && b[t] === kg) return true; }
  var bq = pc(BISHOP, by), qq = pc(QUEEN, by), rq = pc(ROOK, by);
  for (i = 0; i < 4; i++) {
    d = BISHOP_D[i]; t = sq + d;
    while (!(t & 0x88)) {
      p = b[t];
      if (p) { if (p === bq || p === qq) return true; break; }
      t += d;
    }
  }
  for (i = 0; i < 4; i++) {
    d = ROOK_D[i]; t = sq + d;
    while (!(t & 0x88)) {
      p = b[t];
      if (p) { if (p === rq || p === qq) return true; break; }
      t += d;
    }
  }
  return false;
}

function inCheck(s, color) {
  if (color === undefined) color = s.turn;
  return isAttacked(s, s.king[color], color ^ 1);
}

/* ---------- move generation ---------- */

var PROMO_PIECES = [QUEEN, ROOK, BISHOP, KNIGHT];

function genPseudo(s, capturesOnly) {
  var moves = [], b = s.b, us = s.turn, them = us ^ 1;
  var i, sq, p, t, d, j, k;
  for (sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    p = b[sq];
    if (!p || colorOf(p) !== us) continue;
    var ty = typeOf(p);

    if (ty === PAWN) {
      var fwd = (us === WHITE) ? -16 : 16;
      var startRank = (us === WHITE) ? 6 : 1;
      var promoRank = (us === WHITE) ? 0 : 7;
      t = sq + fwd;
      if (!capturesOnly && !(t & 0x88) && !b[t]) {
        if (rankOf(t) === promoRank) {
          for (k = 0; k < 4; k++) moves.push(MOVE(sq, t, PROMO_PIECES[k], F_NORMAL));
        } else {
          moves.push(MOVE(sq, t, 0, F_NORMAL));
          if (rankOf(sq) === startRank && !b[sq + 2 * fwd]) {
            moves.push(MOVE(sq, sq + 2 * fwd, 0, F_DPP));
          }
        }
      }
      var caps = [fwd - 1, fwd + 1];
      for (j = 0; j < 2; j++) {
        t = sq + caps[j];
        if (t & 0x88) continue;
        if (b[t] && colorOf(b[t]) === them) {
          if (rankOf(t) === promoRank) {
            for (k = 0; k < 4; k++) moves.push(MOVE(sq, t, PROMO_PIECES[k], F_NORMAL));
          } else moves.push(MOVE(sq, t, 0, F_NORMAL));
        } else if (t === s.ep) {
          moves.push(MOVE(sq, t, 0, F_EP));
        }
      }
      continue;
    }

    if (ty === KNIGHT || ty === KING) {
      var dirs = (ty === KNIGHT) ? KNIGHT_D : KING_D;
      for (i = 0; i < 8; i++) {
        t = sq + dirs[i];
        if (t & 0x88) continue;
        if (b[t]) {
          if (colorOf(b[t]) === them) moves.push(MOVE(sq, t, 0, F_NORMAL));
        } else if (!capturesOnly) moves.push(MOVE(sq, t, 0, F_NORMAL));
      }
      continue;
    }

    var dd = (ty === BISHOP) ? BISHOP_D : (ty === ROOK) ? ROOK_D : KING_D;
    var nd = (ty === QUEEN) ? 8 : 4;
    for (i = 0; i < nd; i++) {
      d = dd[i]; t = sq + d;
      while (!(t & 0x88)) {
        if (b[t]) {
          if (colorOf(b[t]) === them) moves.push(MOVE(sq, t, 0, F_NORMAL));
          break;
        }
        if (!capturesOnly) moves.push(MOVE(sq, t, 0, F_NORMAL));
        t += d;
      }
    }
  }

  // castling
  if (!capturesOnly) {
    var them2 = us ^ 1;
    if (us === WHITE) {
      if ((s.castle & C_WK) && !b[SQ.f1] && !b[SQ.g1] && b[SQ.h1] === pc(ROOK, WHITE) &&
          !isAttacked(s, SQ.e1, them2) && !isAttacked(s, SQ.f1, them2) && !isAttacked(s, SQ.g1, them2))
        moves.push(MOVE(SQ.e1, SQ.g1, 0, F_KCASTLE));
      if ((s.castle & C_WQ) && !b[SQ.d1] && !b[SQ.c1] && !b[SQ.b1] && b[SQ.a1] === pc(ROOK, WHITE) &&
          !isAttacked(s, SQ.e1, them2) && !isAttacked(s, SQ.d1, them2) && !isAttacked(s, SQ.c1, them2))
        moves.push(MOVE(SQ.e1, SQ.c1, 0, F_QCASTLE));
    } else {
      if ((s.castle & C_BK) && !b[SQ.f8] && !b[SQ.g8] && b[SQ.h8] === pc(ROOK, BLACK) &&
          !isAttacked(s, SQ.e8, them2) && !isAttacked(s, SQ.f8, them2) && !isAttacked(s, SQ.g8, them2))
        moves.push(MOVE(SQ.e8, SQ.g8, 0, F_KCASTLE));
      if ((s.castle & C_BQ) && !b[SQ.d8] && !b[SQ.c8] && !b[SQ.b8] && b[SQ.a8] === pc(ROOK, BLACK) &&
          !isAttacked(s, SQ.e8, them2) && !isAttacked(s, SQ.d8, them2) && !isAttacked(s, SQ.c8, them2))
        moves.push(MOVE(SQ.e8, SQ.c8, 0, F_QCASTLE));
    }
  }
  return moves;
}

var CASTLE_MASK = new Int8Array(128);
(function () {
  for (var i = 0; i < 128; i++) CASTLE_MASK[i] = 15;
  CASTLE_MASK[SQ.e1] = 15 & ~(C_WK | C_WQ);
  CASTLE_MASK[SQ.h1] = 15 & ~C_WK;
  CASTLE_MASK[SQ.a1] = 15 & ~C_WQ;
  CASTLE_MASK[SQ.e8] = 15 & ~(C_BK | C_BQ);
  CASTLE_MASK[SQ.h8] = 15 & ~C_BK;
  CASTLE_MASK[SQ.a8] = 15 & ~C_BQ;
})();

function makeMove(s, m) {
  var from = FROM(m), to = TO(m), promo = PROMO(m), flag = FLAG(m);
  var b = s.b, p = b[from], us = colorOf(p);
  var captured = b[to], capSq = to;

  if (flag === F_EP) {
    capSq = to + (us === WHITE ? 16 : -16);
    captured = b[capSq];
  }

  s.hist.push({
    m: m, cap: captured, capSq: capSq, castle: s.castle,
    ep: s.ep, half: s.half, king: s.king[us]
  });

  if (captured) b[capSq] = 0;
  b[to] = promo ? pc(promo, us) : p;
  b[from] = 0;

  if (flag === F_KCASTLE) {
    if (us === WHITE) { b[SQ.f1] = b[SQ.h1]; b[SQ.h1] = 0; }
    else { b[SQ.f8] = b[SQ.h8]; b[SQ.h8] = 0; }
  } else if (flag === F_QCASTLE) {
    if (us === WHITE) { b[SQ.d1] = b[SQ.a1]; b[SQ.a1] = 0; }
    else { b[SQ.d8] = b[SQ.a8]; b[SQ.a8] = 0; }
  }

  if (typeOf(p) === KING) s.king[us] = to;

  s.castle &= CASTLE_MASK[from] & CASTLE_MASK[to];
  s.ep = (flag === F_DPP) ? (from + (us === WHITE ? -16 : 16)) : -1;
  s.half = (captured || typeOf(p) === PAWN) ? 0 : s.half + 1;
  if (us === BLACK) s.full++;
  s.turn = us ^ 1;
}

function unmakeMove(s) {
  var h = s.hist.pop();
  if (!h) return;
  var m = h.m, from = FROM(m), to = TO(m), promo = PROMO(m), flag = FLAG(m);
  var b = s.b;
  var us = s.turn ^ 1;

  var moved = b[to];
  b[from] = promo ? pc(PAWN, us) : moved;
  b[to] = 0;
  if (h.cap) b[h.capSq] = h.cap;

  if (flag === F_KCASTLE) {
    if (us === WHITE) { b[SQ.h1] = b[SQ.f1]; b[SQ.f1] = 0; }
    else { b[SQ.h8] = b[SQ.f8]; b[SQ.f8] = 0; }
  } else if (flag === F_QCASTLE) {
    if (us === WHITE) { b[SQ.a1] = b[SQ.d1]; b[SQ.d1] = 0; }
    else { b[SQ.a8] = b[SQ.d8]; b[SQ.d8] = 0; }
  }

  s.king[us] = h.king;
  s.castle = h.castle;
  s.ep = h.ep;
  s.half = h.half;
  if (us === BLACK) s.full--;
  s.turn = us;
}

function genLegal(s) {
  var pseudo = genPseudo(s, false), out = [], us = s.turn;
  for (var i = 0; i < pseudo.length; i++) {
    makeMove(s, pseudo[i]);
    if (!isAttacked(s, s.king[us], us ^ 1)) out.push(pseudo[i]);
    unmakeMove(s);
  }
  return out;
}

function genLegalCaptures(s) {
  var pseudo = genPseudo(s, true), out = [], us = s.turn;
  for (var i = 0; i < pseudo.length; i++) {
    makeMove(s, pseudo[i]);
    if (!isAttacked(s, s.king[us], us ^ 1)) out.push(pseudo[i]);
    unmakeMove(s);
  }
  return out;
}

/* ---------- game end detection ---------- */

function insufficientMaterial(s) {
  var counts = { 0: [], 1: [] };
  for (var sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    var p = s.b[sq];
    if (!p) continue;
    var t = typeOf(p);
    if (t === KING) continue;
    if (t === PAWN || t === ROOK || t === QUEEN) return false;
    counts[colorOf(p)].push({ t: t, light: ((fileOf(sq) + rankOf(sq)) % 2) === 0 });
  }
  var w = counts[0], b = counts[1];
  if (w.length === 0 && b.length === 0) return true;                 // K v K
  if (w.length + b.length === 1) return true;                        // K+minor v K
  if (w.length === 1 && b.length === 1 &&
      w[0].t === BISHOP && b[0].t === BISHOP && w[0].light === b[0].light) return true;
  return false;
}

// posKey: compact repeatable signature of a position
function posKey(s) {
  var out = '';
  for (var sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    out += String.fromCharCode(48 + s.b[sq]);
  }
  return out + '|' + s.turn + '|' + s.castle + '|' + s.ep;
}

// history = array of posKey strings for every position that has occurred
function gameResult(s, history) {
  var legal = genLegal(s);
  if (legal.length === 0) {
    if (inCheck(s, s.turn)) return { over: true, type: 'checkmate', winner: s.turn ^ 1 };
    return { over: true, type: 'stalemate', winner: null };
  }
  if (s.half >= 100) return { over: true, type: 'fiftymove', winner: null };
  if (insufficientMaterial(s)) return { over: true, type: 'material', winner: null };
  if (history) {
    var k = posKey(s), n = 0;
    for (var i = 0; i < history.length; i++) if (history[i] === k) n++;
    if (n >= 3) return { over: true, type: 'repetition', winner: null };
  }
  return { over: false, legal: legal };
}

/* ---------- notation ---------- */

var LETTER = { 1: '', 2: 'N', 3: 'B', 4: 'R', 5: 'Q', 6: 'K' };
var FULLNAME = { 1: 'pawn', 2: 'knight', 3: 'bishop', 4: 'rook', 5: 'queen', 6: 'king' };

function toSan(s, m) {
  var from = FROM(m), to = TO(m), promo = PROMO(m), flag = FLAG(m);
  var p = s.b[from], ty = typeOf(p);
  var san;

  if (flag === F_KCASTLE) san = 'O-O';
  else if (flag === F_QCASTLE) san = 'O-O-O';
  else {
    var isCap = !!s.b[to] || flag === F_EP;
    if (ty === PAWN) {
      san = isCap ? ('abcdefgh'[fileOf(from)] + 'x' + sqName(to)) : sqName(to);
    } else {
      var same = [];
      var all = genLegal(s);
      for (var i = 0; i < all.length; i++) {
        var o = all[i];
        if (o !== m && TO(o) === to && typeOf(s.b[FROM(o)]) === ty) same.push(FROM(o));
      }
      var dis = '';
      if (same.length) {
        var sameFile = same.some(function (x) { return fileOf(x) === fileOf(from); });
        var sameRank = same.some(function (x) { return rankOf(x) === rankOf(from); });
        if (!sameFile) dis = 'abcdefgh'[fileOf(from)];
        else if (!sameRank) dis = String(8 - rankOf(from));
        else dis = sqName(from);
      }
      san = LETTER[ty] + dis + (isCap ? 'x' : '') + sqName(to);
    }
    if (promo) san += '=' + LETTER[promo];
  }

  makeMove(s, m);
  if (inCheck(s, s.turn)) san += (genLegal(s).length === 0) ? '#' : '+';
  unmakeMove(s);
  return san;
}

/* ---------- material ---------- */

var VAL = { 1: 100, 2: 320, 3: 330, 4: 500, 5: 900, 6: 20000 };
var KIDVAL = { 1: 1, 2: 3, 3: 3, 4: 5, 5: 9, 6: 0 };

function materialCount(s, color) {
  var total = 0;
  for (var sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    var p = s.b[sq];
    if (p && colorOf(p) === color) total += KIDVAL[typeOf(p)];
  }
  return total;
}

/* ============================================================
   AI LAYER — evaluation, search, bot ladder, coach analysis
   Depends on engine.js globals.
   ============================================================ */

var PST = {};
PST[PAWN] = [
   0,  0,  0,  0,  0,  0,  0,  0,
  50, 50, 50, 50, 50, 50, 50, 50,
  10, 10, 20, 30, 30, 20, 10, 10,

   0,  0,  0,  0,  0,  0,  0,  0];
PST[KNIGHT] = [

 -40,-20,  0,  0,  0,  0,-20,-40,

PST[BISHOP] = [

 -10,  5,  0,  0,  0,  0,  5,-10,
 -20,-10,-10,-10,-10,-10,-10,-20];
PST[ROOK] = [
   0,  0,  0,  0,  0,  0,  0,  0,
   5, 10, 10, 10, 10, 10, 10,  5,
  -5,  0,  0,  0,  0,  0,  0, -5,
  -5,  0,  0,  0,  0,  0,  0, -5,

  -5,  0,  0,  0,  0,  0,  0, -5,
   0,  0,  0,  5,  5,  0,  0,  0];
PST[QUEEN] = [
 -20,-10,-10, -5, -5,-10,-10,-20,
 -10,  0,  0,  0,  0,  0,  0,-10,
 -10,  0,  5,  5,  5,  5,  0,-10,
  -5,  0,  5,  5,  5,  5,  0, -5,
   0,  0,  5,  5,  5,  5,  0, -5,
 -10,  5,  5,  5,  5,  5,  0,-10,
 -10,  0,  5,  0,  0,  0,  0,-10,
 -20,-10,-10, -5, -5,-10,-10,-20];
var KING_MID = [
 -30,-40,-40,-50,-50,-40,-40,-30,
 -30,-40,-40,-50,-50,-40,-40,-30,
 -30,-40,-40,-50,-50,-40,-40,-30,
 -30,-40,-40,-50,-50,-40,-40,-30,
 -20,-30,-30,-40,-40,-30,-30,-20,
 -10,-20,-20,-20,-20,-20,-20,-10,
  20, 20,  0,  0,  0,  0, 20, 20,
  20, 30, 10,  0,  0, 10, 30, 20];
var KING_END = [
 -50,-40,-30,-20,-20,-30,-40,-50,
 -30,-20,-10,  0,  0,-10,-20,-30,
 -30,-10, 20, 30, 30, 20,-10,-30,
 -30,-10, 30, 40, 40, 30,-10,-30,
 -30,-10, 30, 40, 40, 30,-10,-30,
 -30,-10, 20, 30, 30, 20,-10,-30,
 -30,-30,  0,  0,  0,  0,-30,-30,
 -50,-30,-30,-30,-30,-30,-30,-50];

var MATE = 100000;

function pstIndex(sq, color) {
  var r = sq >> 4, f = sq & 15;
  return (color === WHITE) ? (r * 8 + f) : ((7 - r) * 8 + f);
}

var _pfW = new Int8Array(8), _pfB = new Int8Array(8);

function evaluate(s) {
  var b = s.b, sq, p, t, c, phase = 0, score = 0;
  var bishW = 0, bishB = 0, i;
  for (i = 0; i < 8; i++) { _pfW[i] = 0; _pfB[i] = 0; }

  for (sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    p = b[sq];
    if (!p) continue;
    t = p & 7;
    if (t !== KING && t !== PAWN) phase += VAL[t];
    if (t === BISHOP) { if (p & CB) bishB++; else bishW++; }
    if (t === PAWN) { if (p & CB) _pfB[sq & 15]++; else _pfW[sq & 15]++; }
  }
  var endgame = phase < 1800;

  for (sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    p = b[sq];
    if (!p) continue;
    t = p & 7; c = (p & CB) ? BLACK : WHITE;
    var v = VAL[t];
    var idx = pstIndex(sq, c);
    if (t === KING) v += endgame ? KING_END[idx] : KING_MID[idx];
    else v += PST[t][idx];
    score += (c === WHITE) ? v : -v;
  }

  if (bishW >= 2) score += 30;
  if (bishB >= 2) score -= 30;
  for (i = 0; i < 8; i++) {
    if (_pfW[i] > 1) score -= 15 * (_pfW[i] - 1);
    if (_pfB[i] > 1) score += 15 * (_pfB[i] - 1);
  }
  return (s.turn === WHITE) ? score : -score;
}

/* ---------- move ordering (allocation-light, lazy selection) ---------- */

function scoreMoves(s, moves, pvMove, killers, ply) {
  var n = moves.length, sc = new Int32Array(n), b = s.b;
  var kill0 = 0, kill1 = 0;
  if (killers && killers[ply]) { kill0 = killers[ply][0]; kill1 = killers[ply][1]; }
  for (var i = 0; i < n; i++) {
    var m = moves[i], to = (m >> 7) & 127, from = m & 127;
    var victim = b[to], v = 0;
    if (victim) v = 100000 + 10 * VAL[victim & 7] - VAL[b[from] & 7];
    else if (((m >> 17) & 7) === F_EP) v = 100000 + 10 * VAL[PAWN] - VAL[PAWN];
    var promo = (m >> 14) & 7;
    if (promo) v += VAL[promo];
    if (m === pvMove) v += 1000000;
    else if (v < 100000) {
      if (m === kill0) v += 9000;
      else if (m === kill1) v += 8000;
    }
    sc[i] = v;
  }
  return sc;
}

function pickNext(moves, sc, i) {
  var bi = i, n = moves.length;
  for (var j = i + 1; j < n; j++) if (sc[j] > sc[bi]) bi = j;
  if (bi !== i) {
    var tm = moves[i]; moves[i] = moves[bi]; moves[bi] = tm;
    var ts = sc[i]; sc[i] = sc[bi]; sc[bi] = ts;
  }
}

/* ---------- search ---------- */

function Searcher() {
  this.nodes = 0;
  this.deadline = 0;
  this.aborted = false;
  this.killers = [];
}

Searcher.prototype.timeUp = function () {
  if (this.aborted) return true;
  if ((this.nodes & 1023) === 0 && Date.now() > this.deadline) { this.aborted = true; return true; }
  return false;
};

Searcher.prototype.quiesce = function (s, alpha, beta, depth) {
  this.nodes++;
  if (this.timeUp()) return alpha;
  var stand = evaluate(s);
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  if (depth <= 0) return alpha;

  var caps = genLegalCaptures(s);
  var sc = scoreMoves(s, caps, 0, null, 0);
  for (var i = 0; i < caps.length; i++) {
    pickNext(caps, sc, i);
    makeMove(s, caps[i]);
    var v = -this.quiesce(s, -beta, -alpha, depth - 1);
    unmakeMove(s);
    if (this.aborted) return alpha;
    if (v >= beta) return beta;
    if (v > alpha) alpha = v;
  }
  return alpha;
};

Searcher.prototype.negamax = function (s, depth, alpha, beta, ply, useQ) {
  this.nodes++;
  if (this.timeUp()) return alpha;

  var checked = inCheck(s, s.turn);
  if (checked && ply < 12) depth++;                 // bounded check extension

  if (depth <= 0) return useQ ? this.quiesce(s, alpha, beta, 6) : evaluate(s);

  var moves = genLegal(s);
  if (moves.length === 0) return checked ? (-MATE + ply) : 0;
  if (s.half >= 100) return 0;

  var sc = scoreMoves(s, moves, 0, this.killers, ply);
  var best = -Infinity, b = s.b;
  for (var i = 0; i < moves.length; i++) {
    pickNext(moves, sc, i);
    var m = moves[i];
    var isQuiet = !b[(m >> 7) & 127] && ((m >> 17) & 7) !== F_EP;
    makeMove(s, m);
    var v = -this.negamax(s, depth - 1, -beta, -alpha, ply + 1, useQ);
    unmakeMove(s);
    if (this.aborted) return (best === -Infinity) ? alpha : best;
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) {
      if (isQuiet) {
        if (!this.killers[ply]) this.killers[ply] = [0, 0];
        if (this.killers[ply][0] !== m) {
          this.killers[ply][1] = this.killers[ply][0];
          this.killers[ply][0] = m;
        }
      }
      break;
    }
  }
  return best;
};

/* Root search: returns every legal move scored, best first. */
function searchRoot(s, maxDepth, timeMs, useQ) {
  var searcher = new Searcher();
  searcher.deadline = Date.now() + (timeMs || 800);
  var moves = genLegal(s);
  if (moves.length === 0) return [];

  var results = [];
  for (var i0 = 0; i0 < moves.length; i0++) results.push({ move: moves[i0], score: 0 });
  var bestMove = 0;

  for (var d = 1; d <= maxDepth; d++) {
    var sc = scoreMoves(s, moves, bestMove, null, 0);
    var alpha = -Infinity;
    var iter = [];
    var aborted = false;
    for (var i = 0; i < moves.length; i++) {
      pickNext(moves, sc, i);
      var m = moves[i];
      // Full window at every root move: we need exact scores, not bounds,
      // because the weaker bots pick randomly among near-equal top moves.
      makeMove(s, m);
      var v = -searcher.negamax(s, d - 1, -Infinity, Infinity, 1, useQ);
      unmakeMove(s);
      if (searcher.aborted) { aborted = true; break; }
      iter.push({ move: m, score: v });
      if (v > alpha) { alpha = v; bestMove = m; }
    }
    if (!aborted && iter.length === moves.length) {
      iter.sort(function (a, b) { return b.score - a.score; });
      results = iter;
      bestMove = results[0].move;
    }
    if (aborted) break;
    if (Math.abs(alpha) > MATE - 200) break;   // forced mate found
    if (Date.now() > searcher.deadline) break;
  }
  // An aborted iteration still searched the best-ordered moves first, so if it
  // turned up a different favourite, trust the deeper (partial) information.
  if (bestMove && results.length && results[0].move !== bestMove) {
    for (var k = 1; k < results.length; k++) {
      if (results[k].move === bestMove) {
        var promoted = results.splice(k, 1)[0];
        results.unshift(promoted);
        break;
      }
    }
  }
  results.nodes = searcher.nodes;
  return results;
}

/* ---------- static exchange evaluation on a square ----------
   "If the opponent starts capturing here, how much do they win?"
   Positive => that piece is hanging or under-defended. */

function attackersTo(s, sq, by) {
  var list = [], b = s.b, t, i, d, p;
  if (by === WHITE) {
    t = sq + 15; if (!(t & 0x88) && b[t] === PAWN) list.push(PAWN);
    t = sq + 17; if (!(t & 0x88) && b[t] === PAWN) list.push(PAWN);
  } else {
    t = sq - 15; if (!(t & 0x88) && b[t] === (PAWN | CB)) list.push(PAWN);
    t = sq - 17; if (!(t & 0x88) && b[t] === (PAWN | CB)) list.push(PAWN);
  }
  for (i = 0; i < 8; i++) { t = sq + KNIGHT_D[i]; if (!(t & 0x88) && b[t] === pc(KNIGHT, by)) list.push(KNIGHT); }
  for (i = 0; i < 8; i++) { t = sq + KING_D[i]; if (!(t & 0x88) && b[t] === pc(KING, by)) list.push(KING); }
  for (i = 0; i < 4; i++) {
    d = BISHOP_D[i]; t = sq + d;
    while (!(t & 0x88)) {
      p = b[t];
      if (p) { if (colorOf(p) === by && ((p & 7) === BISHOP || (p & 7) === QUEEN)) list.push(p & 7); break; }
      t += d;
    }
  }
  for (i = 0; i < 4; i++) {
    d = ROOK_D[i]; t = sq + d;
    while (!(t & 0x88)) {
      p = b[t];
      if (p) { if (colorOf(p) === by && ((p & 7) === ROOK || (p & 7) === QUEEN)) list.push(p & 7); break; }
      t += d;
    }
  }
  list.sort(function (a, b2) { return VAL[a] - VAL[b2]; });
  return list;
}

function seeSquare(s, sq) {
  var victim = s.b[sq];
  if (!victim) return 0;
  var owner = colorOf(victim);
  var atk = attackersTo(s, sq, owner ^ 1);
  var def = attackersTo(s, sq, owner);
  if (atk.length === 0) return 0;
  // a king may not capture into a defended square
  if (atk.length === 1 && atk[0] === KING && def.length > 0) return 0;
  if (atk[atk.length - 1] === KING && def.length > 0) atk.pop();
  if (atk.length === 0) return 0;

  var gain = [VAL[victim & 7]];
  var ai = 0, di = 0, depth = 0, sideAtk = true, onSq;
  while (true) {
    if (sideAtk) { if (ai >= atk.length) break; onSq = atk[ai++]; }
    else { if (di >= def.length) break; onSq = def[di++]; }
    depth++;
    gain[depth] = VAL[onSq] - gain[depth - 1];
    sideAtk = !sideAtk;
  }
  for (var k = depth - 1; k > 0; k--) {
    gain[k - 1] = -Math.max(-gain[k - 1], gain[k]);
  }
  return gain[0];
}

/* Every piece of `color` the opponent can profitably win right now. */
function hangingPieces(s, color) {
  var out = [];
  for (var sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    var p = s.b[sq];
    if (!p || colorOf(p) !== color || (p & 7) === KING) continue;
    var v = seeSquare(s, sq);
    if (v > 40) out.push({ sq: sq, type: p & 7, gain: v });
  }
  out.sort(function (a, b) { return b.gain - a.gain; });
  return out;
}

/* Would this bot concede? A learner who wins the material should get the win
   even before she can force mate; without this she captures everything and the
   game dribbles into a draw, which is the opposite of encouraging.
   Only the lower half of the ladder ever resigns, and never before move 15, so
   she still gets a real game and still has to learn mating higher up. */
function shouldResign(s, bot, botColor, plyCount) {
  if (!bot || !bot.resignAt) return false;
  if (plyCount < 30) return false;
  return (materialCount(s, botColor ^ 1) - materialCount(s, botColor)) >= bot.resignAt;
}

function chooseBotMove(s, bot) {
  var legal = genLegal(s);
  if (!legal.length) return 0;
  if (legal.length === 1) return legal[0];

  // Gentle turns: decline to capture at all, so a hanging piece usually survives.
  var pool = legal;
  if (bot.gentle && Math.random() < bot.gentle) {
    var quiet = [];
    for (var g = 0; g < legal.length; g++) {
      if (!s.b[TO(legal[g])] && FLAG(legal[g]) !== F_EP) quiet.push(legal[g]);
    }
    if (quiet.length) pool = quiet;
  }

  if (bot.depth === 0) return pool[Math.floor(Math.random() * pool.length)];
  if (bot.rand > 0 && Math.random() < bot.rand) return pool[Math.floor(Math.random() * pool.length)];

  var results = searchRoot(s, bot.depth, bot.time, bot.q);
  if (!results.length) return pool[0];

  if (pool !== legal) {                       // keep the search honest but gentle
    var allowed = {}, i2;
    for (i2 = 0; i2 < pool.length; i2++) allowed[pool[i2]] = 1;
    var kept = [];
    for (i2 = 0; i2 < results.length; i2++) if (allowed[results[i2].move]) kept.push(results[i2]);
    if (kept.length) results = kept;
  }

  if (bot.top <= 1) return results[0].move;
  var bestScore = results[0].score, poolTop = [];
  for (var i = 0; i < results.length && poolTop.length < bot.top; i++) {
    if (bestScore - results[i].score <= 40) poolTop.push(results[i].move);
  }
  if (!poolTop.length) return results[0].move;
  return poolTop[Math.floor(Math.random() * poolTop.length)];
}

/* ---------- coach ---------- */

var COACH_DEPTH = 3, COACH_TIME = 600;

function analyseBest(s, depth, time) {
  var r = searchRoot(s, depth || COACH_DEPTH, time || COACH_TIME, true);
  return r.length ? r[0] : null;
}

/* ============================================================
   COACH LAYER — turns engine numbers into words a 7-9 year old
   can act on. Depends on engine.js + ai.js globals.
   ============================================================ */

var COACH_LEVELS = { BLUNDER: 300, MISTAKE: 140, SLIP: 70 };

var PIECE_WORD = { 1: 'pawn', 2: 'knight', 3: 'bishop', 4: 'rook', 5: 'queen', 6: 'king' };
var PIECE_ICON_W = { 1: '♙', 2: '♘', 3: '♗', 4: '♖', 5: '♕', 6: '♔' };
var PIECE_ICON_B = { 1: '♟', 2: '♞', 3: '♝', 4: '♜', 5: '♛', 6: '♚' };

function describeMove(s, m) {
  var from = FROM(m), to = TO(m), flag = FLAG(m);
  if (flag === F_KCASTLE || flag === F_QCASTLE) return 'castle';
  var p = s.b[from];
  if (!p) return sqName(from) + '-' + sqName(to);
  var txt = PIECE_WORD[p & 7] + ' to ' + sqName(to);
  if (s.b[to]) txt += ' (taking the ' + PIECE_WORD[s.b[to] & 7] + ')';
  if (PROMO(m)) txt += ' and make a ' + PIECE_WORD[PROMO(m)];
  return txt;
}

/* Can the side to move legally capture on this square? */
function hasCaptureTo(s, sq) {
  var legal = genLegal(s);
  for (var i = 0; i < legal.length; i++) if (TO(legal[i]) === sq) return true;
  return false;
}

/* Find the score the search gave to one specific move. */
function scoreOfMove(results, m) {
  for (var i = 0; i < results.length; i++) if (results[i].move === m) return results[i].score;
  return null;
}

/*
  reviewMove(sBefore, move, depth, time)
  sBefore must be the position BEFORE the move, with the learner to move.
  Returns null if nothing worth saying, else a review object.
*/
function reviewMove(sBefore, move, depth, time) {
  var me = sBefore.turn;
  var results = searchRoot(sBefore, depth || 3, time || 700, true);
  if (!results.length) return null;

  var bestScore = results[0].score;
  var bestMove = results[0].move;
  var actual = scoreOfMove(results, move);
  if (actual === null) return null;

  var loss = bestScore - actual;
  var bestSan = toSan(sBefore, bestMove);
  // How much clearer is the best move than the next best? A position where two
  // moves are nearly equal makes a terrible puzzle: there is no findable answer.
  var clarity = (results.length > 1) ? (bestScore - results[1].score) : 9999;

  // look at the position AFTER the move
  var after = cloneState(sBefore);
  makeMove(after, move);
  var myHang = hangingPieces(after, me);
  var movedTo = TO(move);
  var oppHangBefore = hangingPieces(sBefore, me ^ 1);

  var missedMate = bestScore > MATE - 200 && actual < MATE - 200;
  var allowsMate = actual < -(MATE - 200) && bestScore > -(MATE - 200);

  var severity = 'ok';
  if (missedMate || allowsMate || loss >= COACH_LEVELS.BLUNDER) severity = 'blunder';
  else if (loss >= COACH_LEVELS.MISTAKE) severity = 'mistake';
  else if (loss >= COACH_LEVELS.SLIP) severity = 'slip';

  var rv = {
    severity: severity, loss: loss, clarity: clarity,
    bestMove: bestMove, bestSan: bestSan,
    bestPlain: describeMove(sBefore, bestMove), tag: 'other',
    headline: '', detail: '', good: false
  };

  /* ---- praise path ---- */
  if (severity === 'ok') {
    if (actual > MATE - 200) { rv.good = true; rv.tag = 'mate'; rv.headline = 'Checkmate! Beautiful.'; return rv; }
    var gained = sBefore.b[movedTo] ? KIDVAL[sBefore.b[movedTo] & 7] : 0;
    if (gained >= 3 && myHang.length === 0) {
      rv.good = true; rv.tag = 'goodcapture';
      rv.headline = 'Nice! You won a ' + PIECE_WORD[sBefore.b[movedTo] & 7] + ' and stayed safe.';
      return rv;
    }
    if (move === bestMove && loss === 0) {
      rv.good = true; rv.tag = 'best';
      rv.headline = 'That was the best move on the board.';
      return rv;
    }
    return null;   // fine move, nothing to say
  }

  /* ---- problem path: name the pattern ---- */
  if (missedMate) {
    rv.tag = 'missedmate';
    rv.headline = 'You had checkmate!';
    rv.detail = 'The winning move was ' + bestSan + ' — ' + rv.bestPlain + '. Look for checks first: check, capture, then everything else.';
    return rv;
  }
  if (allowsMate) {
    rv.tag = 'allowsmate';
    rv.headline = 'Careful — that lets them checkmate you.';
    rv.detail = 'Before you move, ask: can they check my king next turn? ' + bestSan + ' would have kept your king safe.';
    return rv;
  }

  // Two things can be wrong at once. Lead with whichever costs more material,
  // otherwise the coach tells a child about a pawn while a queen is on offer.
  var worst = myHang.length ? myHang[0] : null;
  var freebie = null;
  for (var fi = 0; fi < oppHangBefore.length; fi++) {
    if (hasCaptureTo(sBefore, oppHangBefore[fi].sq)) { freebie = oppHangBefore[fi]; break; }
  }
  var hangCost = worst ? worst.gain : 0;
  var missCost = freebie ? freebie.gain : 0;
  // taking something yourself offsets a missed capture elsewhere
  if (freebie && sBefore.b[movedTo]) missCost -= VAL[sBefore.b[movedTo] & 7];

  if (freebie && missCost >= hangCost && missCost > 0) {
    rv.tag = 'missedcapture';
    rv.headline = 'There was a free ' + PIECE_WORD[freebie.type] + ' on ' + sqName(freebie.sq) + '.';
    rv.detail = bestSan + ' would have won it. Every turn, look at their loose pieces first.';
    return rv;
  }
  if (worst && worst.sq === movedTo) {
    rv.tag = 'movedintodanger';
    rv.headline = 'Your ' + PIECE_WORD[worst.type] + ' can be taken on ' + sqName(worst.sq) + '.';
    rv.detail = 'You moved it to a square they attack, and it is not defended enough. ' +
                'Before letting go of a piece, ask: "if I put it here, who can take it?"';
    return rv;
  }
  if (worst) {
    rv.tag = 'leftHanging';
    rv.headline = 'You left your ' + PIECE_WORD[worst.type] + ' on ' + sqName(worst.sq) + ' where it can be taken.';
    rv.detail = 'It is attacked and nothing is guarding it. After every move, scan your own pieces and count attackers against defenders.';
    return rv;
  }

  rv.tag = 'better';
  rv.headline = 'There was a stronger move: ' + bestSan + '.';
  rv.detail = 'Try ' + rv.bestPlain + '. Compare your idea with one other idea before you play.';
  return rv;
}

/* A hint for the learner, in kid language. */
function makeHint(s) {
  var results = searchRoot(s, 3, 700, true);
  if (!results.length) return null;
  var m = results[0].move;
  var me = s.turn;
  var hint = { move: m, san: toSan(s, m), text: '' };

  if (results[0].score > MATE - 200) { hint.text = 'There is a checkmate here. Look for a check!'; return hint; }

  var myHang = hangingPieces(s, me);
  var theirHang = hangingPieces(s, me ^ 1);
  var target = s.b[TO(m)];

  if (target) hint.text = 'Look at their ' + PIECE_WORD[target & 7] + ' on ' + sqName(TO(m)) + '. Can you take it?';
  else if (myHang.length) hint.text = 'Your ' + PIECE_WORD[myHang[0].type] + ' on ' + sqName(myHang[0].sq) + ' is in danger. Save it or defend it.';
  else if (theirHang.length) hint.text = 'Their ' + PIECE_WORD[theirHang[0].type] + ' on ' + sqName(theirHang[0].sq) + ' is loose. Can you attack it?';
  else hint.text = 'Try moving your ' + (s.b[FROM(m)] ? PIECE_WORD[s.b[FROM(m)] & 7] : 'piece') + ' toward the middle.';
  return hint;
}

/* Squares of the learner's pieces that are currently in danger (for Danger Goggles). */
function dangerSquares(s, color) {
  var out = [];
  var h = hangingPieces(s, color);
  for (var i = 0; i < h.length; i++) out.push(h[i].sq);
  return out;
}

/* One practice tip from the pattern that hurt most this game. */
var TIPS = {

/* ---------------- worker ---------------- */
var worker = null, reqId = 0, pending = {};
var WORKER_GLUE = "\nself.onmessage=function(e){var d=e.data,out={};try{" +
  "if(d.cmd==='bot'){var s=loadFen(d.fen);out.move=chooseBotMove(s,d.bot);}" +
  "else if(d.cmd==='review'){var s2=loadFen(d.fen);out.review=reviewMove(s2,d.move,d.depth,d.time);}" +
  "else if(d.cmd==='hint'){var s3=loadFen(d.fen);out.hint=makeHint(s3);}" +
  "else if(d.cmd==='danger'){var s4=loadFen(d.fen);out.sqs=dangerSquares(s4,d.color);}" +
  "else if(d.cmd==='score'){var s5=loadFen(d.fen);var r=searchRoot(s5,3,500,true);out.top=r.length?r[0].score:0;" +
  "out.mine=null;for(var i=0;i<r.length;i++){if(FROM(r[i].move)===d.from&&TO(r[i].move)===d.to){out.mine=r[i].score;break;}}}" +
  "}catch(err){out.error=String(err&&err.message||err);}out.id=d.id;self.postMessage(out);};\n";

function initWorker() {
  try {
    var core = document.getElementById('chess-core').textContent;
    var blob = new Blob([core + WORKER_GLUE], { type: 'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = function (e) {
      var d = e.data, cb = pending[d.id];
      if (cb) { delete pending[d.id]; cb(d); }
    };
    worker.onerror = function () { worker = null; };
  } catch (e) { worker = null; }
}

function ask(cmd, payload, done) {
  var msg = payload || {};
  msg.cmd = cmd; msg.id = ++reqId;
  if (worker) {
    pending[msg.id] = done;
    try { worker.postMessage(msg); return; }
    catch (e) { worker = null; delete pending[msg.id]; }
  }
  setTimeout(function () {                       /* main-thread fallback */
    var out = {};
    try {
      var s = loadFen(msg.fen);
      if (cmd === 'bot') out.move = chooseBotMove(s, msg.bot);
      else if (cmd === 'review') out.review = reviewMove(s, msg.move, msg.depth, msg.time);
      else if (cmd === 'hint') out.hint = makeHint(s);
      else if (cmd === 'danger') out.sqs = dangerSquares(s, msg.color);
      else if (cmd === 'score') {
        var r = searchRoot(s, 3, 500, true);
        out.top = r.length ? r[0].score : 0; out.mine = null;
        for (var i = 0; i < r.length; i++) {
          if (FROM(r[i].move) === msg.from && TO(r[i].move) === msg.to) { out.mine = r[i].score; break; }
        }
      }
    } catch (err) { out.error = String(err && err.message || err); }
    done(out);
  }, 40);
}

    if (col === 0) { var c2 = document.createElement('span'); c2.className = 'coord r'; c2.textContent = String(8 - rankOf(sq)); d.appendChild(c2); }

function render() {

function refreshDanger(cb) {

  ask('danger', { fen: toFen(G.s), color: G.myColor }, function (res) {

function commit(m) {
  var s = G.s;
  var wasCapture = !!s.b[TO(m)] || FLAG(m) === F_EP;
  var fenBefore = toFen(s);
  var san = toSan(s, m);
  var mover = s.turn;
  makeMove(s, m);
  G.hist.push(posKey(s));
  G.lastMove = m;
  G.sel = -1; G.targets = {};
  if (inCheck(s, s.turn)) SFX.check();
  else if (wasCapture) SFX.capture();
  else SFX.move();
  render();
  return { fenBefore: fenBefore, move: m, san: san, mover: mover };

function humanMove(m) {
  if (G.phase !== 'myturn') return;
  var rec = commit(m);
  G.records.push(rec);
  var over = gameResult(G.s, G.hist);
  if (over.over) { finish(over); return; }
  var repWarn = '';
  if (repCount() === 2) {
    repWarn = aheadBy(G.myColor) >= 3
      ? 'Careful — if this same position happens one more time it is a draw, even though you are winning. Try a different plan.'
      : 'This position has now happened twice. One more time and the game is a draw.';
  }
  if (!G.settings.coach) {
    if (repWarn) say('Watch out for a repeat.', repWarn, 'bad');
    G.phase = 'botturn'; botMove(); return;
  }
  G.phase = 'reviewing';
  say('Coach is checking that move…', '', '');
  ask('review', { fen: rec.fenBefore, move: m, depth: 3, time: 550 }, function (res) {
    var rv = res && res.review;
    rec.review = rv || null;
    if (rv && !rv.good && rv.severity === 'blunder') savePuzzleFromMistake(rec);
    if (rv && !rv.good && rv.severity === 'blunder' && G.doOvers > 0) return offerDoOver(rv);
    if (repWarn) say('Watch out for a repeat.', repWarn, 'bad');
    else if (rv && rv.good) { SFX.good(); say(rv.headline, '', 'good'); }
    else if (rv && (rv.severity === 'mistake' || rv.severity === 'blunder')) say(rv.headline, rv.detail, 'bad');
    else say(bot().name + ' is thinking…', '', '', null, bot().icon);
    G.phase = 'botturn';
    setTimeout(botMove, 220);
  });
}

function offerDoOver(rv) {
  G.phase = 'offering';
  SFX.bad();
  say('Wait — ' + rv.headline, rv.detail + '  You have ' + G.doOvers + ' do-over' + (G.doOvers === 1 ? '' : 's') + ' left.', 'alert', [
    { label: 'Try again ♥', style: 'warn', fn: takeBack },
    { label: 'Keep my move', style: 'ghost', fn: function () {
        G.phase = 'botturn'; say(bot().name + ' is thinking…', '', '', null, bot().icon); setTimeout(botMove, 150);
      } }
  ]);
}

function takeBack() {
  unmakeMove(G.s); G.hist.pop(); G.records.pop();
  G.doOvers--;
  G.lastMove = lastPlayed();
  G.sel = -1; G.targets = {};
  G.phase = 'myturn';
  updateChrome(); refreshDanger();
  say('Good thinking — try a different move.', 'Look at every piece they attack before you choose.', '');
}

function botMove() {
  var over = gameResult(G.s, G.hist);
  if (over.over) { finish(over); return; }
  if (shouldResign(G.s, bot(), G.myColor ^ 1, G.hist.length)) {
    finish({ over: true, type: 'resign', winner: G.myColor });
    return;
  }
  G.phase = 'botturn';
  say(bot().name + ' is thinking…', '', '', null, bot().icon);
  ask('bot', { fen: toFen(G.s), bot: bot() }, function (res) {
    if (G.mode !== 'play') return;                       /* she switched to puzzles mid-think */
    var legal = genLegal(G.s);
    var mv = (res && res.move && legal.indexOf(res.move) >= 0) ? res.move : legal[0];
    if (!mv) { finish(gameResult(G.s, G.hist)); return; }
    // Do not hand back a draw by shuffling when not actually losing.
    if (movePepeats(mv) && aheadBy(G.myColor ^ 1) >= -2) {
      for (var i = 0; i < legal.length; i++) {
        if (legal[i] !== mv && !movePepeats(legal[i])) { mv = legal[i]; break; }

    var r2 = gameResult(G.s, G.hist);
    if (r2.over) { finish(r2); return; }
    G.phase = 'myturn';
    refreshDanger();
    if (inCheck(G.s, G.myColor)) say('You are in check!', 'You must get your king out of danger this move.', 'bad');
    else if (aheadBy(G.myColor) >= 9) say('You are miles ahead!',

  var el = document.elementFromPoint(x, y);

boardEl.addEventListener('pointerdown', function (e) {
  if (!canMove()) return;

  if (sq < 0) return;
  var p = G.s.b[sq];
  if (G.sel >= 0 && G.targets[sq]) { tryMoveTo(sq); return; }
  if (p && colorOf(p) === moverColor()) {
    selectSquare(sq);

  ghost.style.display = 'block';
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = (e.clientY - size * 0.35) + 'px';
  ghost.style.width = (size * 0.86) + 'px';
  ghost.style.height = (size * 0.86) + 'px';

  // would be asking a child to guess between two moves the engine rates alike.
  if (typeof rv.clarity === 'number' && rv.clarity < PZ_MIN_CLARITY) return;
  for (var i = 0; i < PZ.own.length; i++) if (PZ.own[i].f === rec.fenBefore) return;
  PZ.own.unshift(puzzleFromReview(rec.fenBefore, rv));
  if (PZ.own.length > 60) PZ.own.length = 60;
  savePuzzleData();
}

function buildQueue(priority) {
  PZ.session++;
  var all = allPuzzles();
  var due = [], later = [];
  all.forEach(function (p) {
    var pr = PZ.progress[p.f];
    if (!pr || pr.due <= PZ.session) due.push(p); else later.push(p);
  });
  function rank(p) {
    var pr = PZ.progress[p.f] || { box: 0 };
    return (p.own ? 0 : 100) + pr.box * 10 + (p.tier || 2);
  }
  due.sort(function (a, b) { return rank(a) - rank(b); });
  if (!due.length) {
    later.sort(function (a, b) { return rank(a) - rank(b); });
    due = later.slice(0, 10);
  }
  if (priority && priority.length) {
    var keys = {};
    priority.forEach(function (p) { keys[p.f] = 1; });
    due = priority.concat(due.filter(function (p) { return !keys[p.f]; }));
  }
  PZ.queue = due;
  savePuzzleData();
}

function enterPuzzles(priority) {
  G.mode = 'puzzle';
  G.phase = 'puzzle';
  PZ.sessionSolved = 0; PZ.sessionSeen = 0; PZ.streak = 0;
  buildQueue(priority);
  hideOverlay();
  updateChrome();
  if (!PZ.queue.length) {
    PZ.current = null;
    say('No puzzles yet!', 'Play a game first — every big mistake gets saved here to practise later.', '', [
      { label: 'Back to the game', style: 'primary', fn: newGame }
    ], '🧩');
    return;
  }
  nextPuzzle();
}

function nextPuzzle() {
  G.flash = {};
  if (!PZ.queue.length) { showPuzzleSummary(); return; }
  var p = PZ.queue.shift();
  PZ.current = p; PZ.tries = 0; PZ.revealed = false;
  PZ.sessionSeen++;
  G.s = loadFen(p.f);
  G.viewColor = G.s.turn;                        /* always shown from the solver's side */
  G.hist = [posKey(G.s)];
  G.lastMove = 0; G.sel = -1; G.targets = {}; G.danger = [];
  buildBoard(); render(); updateChrome();
  var who = G.s.turn === WHITE ? 'White' : 'Black';
  say(p.q, 'You are ' + who + '. ' + (p.own ? 'This one is from your own game. ' : '') +
      'Puzzle ' + PZ.sessionSeen + '  •  streak ' + PZ.streak, '', null, p.own ? '🔁' : '🧩');
}

function markPuzzle(solvedCleanly) {
  var p = PZ.current;
  var pr = PZ.progress[p.f] || { box: 1, right: 0, wrong: 0, due: 0 };
  if (solvedCleanly) {
    pr.right++;
    pr.box = Math.min(4, pr.box + 1);
    pr.due = PZ.session + [1, 2, 4, 8][pr.box - 1];
  } else {
    pr.wrong++; pr.box = 1; pr.due = PZ.session + 1;
  }
  PZ.progress[p.f] = pr;
  PZ.stats.attempted++;
  if (solvedCleanly) {
    PZ.stats.solved++; PZ.streak++; PZ.sessionSolved++;
    if (PZ.streak > PZ.stats.bestStreak) PZ.stats.bestStreak = PZ.streak;
  } else PZ.streak = 0;
  savePuzzleData();
  updateChrome();
}

function puzzleAnswer(m) {
  var p = PZ.current;
  if (!p || PZ.revealed) return;
  var from = nameToSq(p.from), to = nameToSq(p.to);
  var correct = (FROM(m) === from && TO(m) === to) && (!p.pr || PROMO(m) === p.pr);

  if (correct) {
    var san = toSan(G.s, m);
    var clean = PZ.tries === 0;
    makeMove(G.s, m);
    G.lastMove = m; G.sel = -1; G.targets = {};
    SFX.good();
    flash([from, to], 'right', 900);
    markPuzzle(clean);
    var praise = clean ? ['Yes!', 'Got it!', 'Exactly right!', 'Beautiful!'][PZ.sessionSeen % 4] : 'That is the one.';
    say(praise + '  ' + san,
        clean ? 'First try. Streak: ' + PZ.streak : 'You found it in the end — that still counts as practice.',
        'good', [{ label: 'Next puzzle →', style: 'primary', fn: nextPuzzle }]);
    setTimeout(function () { if (PZ.current === p) nextPuzzle(); }, 1900);
    return;
  }

  PZ.tries++;
  G.sel = -1; G.targets = {};
  SFX.bad();
  flash([FROM(m), TO(m)], 'wrong', 700);

  if (PZ.tries >= 3) { revealAnswer('Here is the move.'); return; }

  /* Was her move actually good too? Say so rather than a flat "wrong". */
  ask('score', { fen: p.f, from: FROM(m), to: TO(m) }, function (res) {
    if (PZ.current !== p || PZ.revealed) return;
    var closeCall = res && res.mine !== null && res.mine !== undefined && (res.top - res.mine) < 80;
    var head = closeCall ? 'That is a good move too — but there is a better one.'
                         : (PZ.tries === 1 ? 'Not quite. Have another look.' : 'Still not it — one more try.');
    say(head, nudgeFor(p.t), 'bad', [
      { label: 'Show me', style: 'ghost', fn: function () { revealAnswer('No problem — here it is.'); } }
    ]);
  });
}

function revealAnswer(lead) {
  var p = PZ.current;
  if (!p || PZ.revealed) return;
  PZ.revealed = true;
  var from = nameToSq(p.from), to = nameToSq(p.to);
  var legal = genLegal(G.s), mv = null;
  for (var i = 0; i < legal.length; i++) {
    if (FROM(legal[i]) === from && TO(legal[i]) === to && (!p.pr || PROMO(legal[i]) === p.pr)) { mv = legal[i]; break; }
  }
  markPuzzle(false);
  if (mv) { makeMove(G.s, mv); G.lastMove = mv; }
  G.sel = -1; G.targets = {};
  flash([from, to], 'right', 2200);
  say(lead + '  The move was ' + p.a + '.', nudgeFor(p.t) + '  You will see this one again soon.', 'bad',
      [{ label: 'Next puzzle →', style: 'primary', fn: nextPuzzle }]);
}

function puzzleHint() {
  var p = PZ.current;
  if (!p || PZ.revealed) return;
  PZ.tries = Math.max(PZ.tries, 1);
  var from = nameToSq(p.from);
  G.sel = from; G.targets = {};
  var legal = genLegal(G.s);
  for (var i = 0; i < legal.length; i++) if (FROM(legal[i]) === from) G.targets[TO(legal[i])] = true;
  render();
  var piece = G.s.b[from];
  say('Move this piece.', 'It is your ' + (piece ? NAMEOF[piece & 7] : 'piece') + '. Now work out where it should go.', '');
}

/* ================= END OF GAME ================= */
function finish(result) {
  G.phase = 'over';
  G.sel = -1; G.targets = {}; G.danger = [];
  render();
  G.stats.played++;
  var isWinType = result.type === 'checkmate' || result.type === 'resign';
  var iWon = isWinType && result.winner === G.myColor;
  var iLost = result.type === 'checkmate' && result.winner !== G.myColor;
  G.lastResult = result.type;

  if (iWon) {
    G.stats.won++; G.lossStreak = 0; SFX.win();
    var wasTop = G.level >= 10;
    if (wasTop) G.stats.crowns = (G.stats.crowns || 0) + 1; else G.level++;
    G.stats.best = Math.max(G.stats.best, G.level);
    saveProgress(); updateChrome();
    showWin(wasTop);
    return;
  }
  if (iLost) { G.stats.lost++; G.lossStreak++; SFX.lose(); saveProgress(); showLoss(); return; }
  G.stats.drawn++; G.lossStreak = 0; saveProgress();
  showDraw(result.type);
}

function puzzlesFromThisGame() {
  var out = [], seen = {};
  G.records.forEach(function (r) {
    if (!r.review || r.review.good || r.review.severity !== 'blunder' || !r.review.bestMove) return;
    if (typeof r.review.clarity === 'number' && r.review.clarity < PZ_MIN_CLARITY) return;
    if (seen[r.fenBefore]) return;
    seen[r.fenBefore] = 1;
    out.push(puzzleFromReview(r.fenBefore, r.review));
  });
  return out;
}

      : 'You are now on level ' + G.level + '. Your next opponent is ' + nb.icon + ' <b>' + nb.name + '</b>: "' + nb.line + '"') + '</p>' +

function showMoment(rec) {
  var wrap = $('mini'); if (!wrap) return;
  wrap.style.display = 'block';
  var s = loadFen(rec.fenBefore);
  var mb = $('miniBoard'); mb.innerHTML = '';
  var order = displayOrder();
  for (var i = 0; i < 64; i++) {
    var sq = order[i];
    var d = document.createElement('div');
    d.className = 'sq ' + (((rankOf(sq) + fileOf(sq)) % 2 === 0) ? 'l' : 'd');
    var p = s.b[sq];
    if (p) {
      var sp = document.createElement('span');
      sp.className = 'pcwrap';
      sp.innerHTML = pieceSvg(p & 7, colorOf(p) === WHITE);
      d.appendChild(sp);
    }
    mb.appendChild(d);
  }
  fitBoard();
  function xy(sq) { var idx = order.indexOf(sq); return { x: (idx % 8) + 0.5, y: ((idx / 8) | 0) + 0.5 }; }
  function arrow(m, color, id) {
    var a = xy(FROM(m)), b = xy(TO(m));
    return '<defs><marker id="h' + id + '" markerWidth="4" markerHeight="4" refX="2.6" refY="2" orient="auto">' +
      '<path d="M0,0 L4,2 L0,4 z" fill="' + color + '"/></marker></defs>' +
      '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + color +
      '" stroke-width="0.22" stroke-linecap="round" opacity="0.9" marker-end="url(#h' + id + ')"/>';
  }
  $('miniSvg').innerHTML = arrow(rec.move, '#ff6b6b', 'r') + arrow(rec.review.bestMove, '#5fd08c', 'g');
  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

    say('Hint: ' + res.hint.text, 'A strong move here is ' + res.hint.san + '.', '');
    G.sel = FROM(res.hint.move); G.targets = {}; G.targets[TO(res.hint.move)] = true;
    render();

$('btnUndo').onclick = function () {
  if (G.phase === 'offering') { takeBack(); return; }
  if (G.phase !== 'myturn' || G.doOvers <= 0 || G.records.length < 1 || G.s.hist.length < 2) return;
  unmakeMove(G.s); G.hist.pop();
  unmakeMove(G.s); G.hist.pop(); G.records.pop();
  G.doOvers--;
  G.lastMove = lastPlayed();
  G.sel = -1; G.targets = {};
  updateChrome(); refreshDanger();
  say('Do-over taken.', 'Have another think about this position.', '');
};
$('btnGoggles').onclick = function () {
  G.settings.goggles = !G.settings.goggles; saveProgress(); updateChrome(); refreshDanger();
};
$('btnNew').onclick = function () {
  showOverlay('<h2>Start a new game?</h2><p>This game will end. Your level stays the same.</p>' +
    '<div class="row"><button class="btn primary" id="nYes">Yes, new game</button>' +
    '<button class="btn ghost" id="nNo">Keep playing</button></div>');
  $('nYes').onclick = newGame;
  $('nNo').onclick = hideOverlay;
};
$('btnPzHint').onclick = puzzleHint;
$('btnPzSkip').onclick = function () { revealAnswer('Skipped —'); };
$('btnPzQuit').onclick = showPuzzleSummary;
$('btnMode').onclick = function () { if (G.mode === 'puzzle') newGame(); else enterPuzzles(); };
$('btnMenu').onclick = showMenu;

/* console hook for debugging and for setting up positions */
window.ChessQuest = {
  state: G, puzzles: PZ, play: submitMove, newGame: newGame, render: render,
  enterPuzzles: enterPuzzles, fitBoard: fitBoard, allPuzzles: allPuzzles,
  setLevel: function (n) { G.level = Math.min(10, Math.max(1, n)); saveProgress(); updateChrome(); }
};

/* ================= BOOT ================= */
loadProgress();
loadPuzzleData();
applyTheme(G.settings.theme);
initWorker();
G.s = loadFen(START_FEN);
G.viewColor = G.myColor;
buildBoard();
updateChrome();
render();
showStart();
setTimeout(fitBoard, 60);

})();

</script>
<script>
/* Offline support. A service worker has to be a real same-origin file, so
   this is the one thing the game loads that is not inside this HTML. It is
   optional by design: on file://, or in a browser without service workers,
   registration is skipped and the game behaves exactly as it always has. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
